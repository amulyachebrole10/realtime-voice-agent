[global]
type=global
user_agent=Local-AI-Telecalling-Agent

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=1001-auth
aors=1001

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=CHANGE_THIS_LOCAL_PASSWORD

[1001]
type=aor
max_contacts=2
remove_existing=yes

; Example provider trunk. Replace placeholders with provider-issued values.
; Never commit real SIP credentials.
[provider]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw
outbound_auth=provider-auth
aors=provider
from_user=CHANGE_ME
from_domain=CHANGE_ME

[provider-auth]
type=auth
auth_type=userpass
username=CHANGE_ME
password=CHANGE_ME

[provider]
type=aor
contact=sip:CHANGE_ME
qualify_frequency=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
