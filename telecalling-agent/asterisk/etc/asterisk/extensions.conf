[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
AGENT_HOST=voice-agent
AGENT_PORT=9092

[from-internal]
; Dial 7000 from a registered softphone to speak to the AI agent.
exten => 7000,1,NoOp(Local AI telecaller demo)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AudioSocket(\${UUID()},\${AGENT_HOST}:\${AGENT_PORT})
 same => n,Hangup()

[from-trunk]
exten => s,1,NoOp(Inbound AI receptionist)
 same => n,Answer()
 same => n,AudioSocket(\${UUID()},\${AGENT_HOST}:\${AGENT_PORT})
 same => n,Hangup()
