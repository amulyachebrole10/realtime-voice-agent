services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8020:8000"
      - "9092:9092/tcp"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      WHISPER_MODEL: tiny
      PIPER_MODEL: /models/en_US-lessac-medium.onnx
      ASTERISK_SPOOL: /var/spool/asterisk/outgoing
      AUDIO_SOCKET_HOST: voice-agent
    volumes:
      - ./models:/models:ro
      - ./data:/app/data
      - ./asterisk-spool:/var/spool/asterisk/outgoing
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk:ro
      - ./asterisk-spool:/var/spool/asterisk/outgoing
    depends_on:
      - voice-agent
    restart: unless-stopped
