services:
  voice-api:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      WHISPER_MODEL: tiny
      PIPER_MODEL: /models/en_US-lessac-medium.onnx
    volumes:
      - ./models:/models
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
